<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7ff5a"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="16"
    fill="#080b0a"
  />

  <rect
    x="3.5"
    y="3.5"
    width="57"
    height="57"
    rx="15.5"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
    opacity="0.8"
  />

  <text
    x="32"
    y="39"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="-2"
    fill="url(#accent)"
    filter="url(#glow)"
  >
    KB
  </text>
</svg>